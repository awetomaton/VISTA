name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.*"
          args: check --output-format=github

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.*"
          args: format --check --diff
