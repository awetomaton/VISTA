name: Build and Deploy Documentation

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags
          lfs: true       # Enable Git LFS to download large files (GIFs, images)

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Configure Git for sphinx-multiversion
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build documentation with sphinx-multiversion
        run: |
          cd docs
          sphinx-multiversion source build/html
        env:
          # Install the package for each version that sphinx-multiversion builds
          # The {git_root} placeholder is replaced with the temp checkout path
          SPH_MV_PRE_BUILD_COMMAND: "pip install -q -e {git_root}"

      - name: Copy version selector to all versions
        run: |
          # Copy the latest version-selector.js to all version directories
          # This ensures old versions get the dynamic version selector
          LATEST_JS="docs/build/html/main/_static/version-selector.js"
          if [ -f "$LATEST_JS" ]; then
            for dir in docs/build/html/*/; do
              dir_name=$(basename "$dir")
              # Skip the main directory (source of the file) to avoid copying to itself
              if [ "$dir_name" != "main" ] && [ -d "${dir}_static" ]; then
                cp "$LATEST_JS" "${dir}_static/version-selector.js"
                echo "Copied version-selector.js to ${dir}_static/"
              fi
            done
          fi

      - name: Generate versions.json and redirect
        run: |
          # Generate versions.json from the built directories
          cd docs/build/html
          echo '[' > versions.json
          first=true
          for dir in */; do
            dir_name="${dir%/}"
            # Skip if not a version directory (e.g., _static, _sources)
            if [[ "$dir_name" != _* ]]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo ',' >> versions.json
              fi
              echo "  {\"name\": \"$dir_name\", \"url\": \"./$dir_name/\"}" >> versions.json
            fi
          done
          echo ']' >> versions.json
          cd -

          # Create index.html that redirects to latest stable version
          cat > docs/build/html/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting to latest version</title>
            <meta http-equiv="refresh" content="0; url=./main/index.html">
            <link rel="canonical" href="./main/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="./main/index.html">latest version</a>...</p>
          </body>
          </html>
          EOF

      - name: Create .nojekyll file
        run: |
          touch docs/build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation'
