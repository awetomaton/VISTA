[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-imagery"
dynamic = ["version"]
description = "A PyQt6-based desktop application for viewing, analyzing, and managing multi-frame imagery datasets along with associated detection and track overlays"
readme = "readme.md"
license = { text = "MIT" }
authors = [
    { name = "Stephen Hartzell", email = "shartzell@awetomaton.com" },
]
maintainers = [
    { name = "Stephen Hartzell", email = "shartzell@awetomaton.com" },
]
keywords = [
    "VISTA",
    "tracking",
    "detection",
    "imagery",
    "PyQt6",
    "scientific",
    "analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Qt",
]
requires-python = ">=3.9"
dependencies = [
    "astropy",
    "darkdetect",
    "h5py",
    "numpy",
    "pandas",
    "Pillow",
    "PyQt6",
    "pyqtgraph",
    "pyshp",
    "scikit-image",
    "scipy",
    "shapely",
    "numba",
]

[project.optional-dependencies]
gpu = [
    "torch",
]
dev = [
    "pytest>=7.0",
    "pytest-qt", 
    "ruff~=0.16.0",
]
docs = [
    "sphinx>=7.0,<9.0",
    "furo>=2024.1.29",
    "sphinx-autosummary-accessors>=2023.4.0",
    "sphinx-multiversion>=0.2.4",
]

[project.urls]
Homepage = "https://github.com/awetomaton/VISTA"
Repository = "https://github.com/awetomaton/VISTA"
Issues = "https://github.com/awetomaton/VISTA/issues"
Documentation = "https://awetomaton.github.io/VISTA/"

[project.gui-scripts]
vista = "vista.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["scripts*", "notebooks*", "docs*", "data*"]

[tool.setuptools.dynamic]
version = { attr = "vista.__version__" }

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", "docs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # Line too long. Let formatter wrap lines.
]
pydocstyle = { convention = "numpy" }
