{# Version selector component for sphinx-multiversion #}
{# Include this template where you want a version dropdown #}
{% if versions %}
<div class="version-selector">
  <select id="version-selector-inline" onchange="window.location.href = this.value">
    {% for item in versions %}
    <option value="{{ item.url }}" {% if current_version and item.name == current_version.name %}selected{% endif %}>
      {{ item.name }}{% if item.name == 'main' %} (latest){% endif %}
    </option>
    {% endfor %}
  </select>
</div>
{% endif %}
