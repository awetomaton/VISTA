{% extends "!base.html" %}

{# Inject version selector in the announcement area (top of page) #}
{% block announcement %}
  {{ super() }}
  {# sphinx-multiversion provides 'versions' (list) and 'current_version' (object) #}
  {% if versions %}
  <div class="version-selector-banner">
    <label for="version-selector">Version:</label>
    <select id="version-selector">
      {% for item in versions %}
      <option value="{{ item.url }}" {% if current_version and item.name == current_version.name %}selected{% endif %}>
        {{ item.name }}{% if item.name == 'main' %} (latest){% endif %}
      </option>
      {% endfor %}
    </select>
  </div>
  {% endif %}
{% endblock %}
